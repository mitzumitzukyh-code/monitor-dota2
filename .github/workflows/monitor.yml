name: Monitor TI2026

# Corre en los servidores de GitHub, no en la PC de casa. El motivo concreto:
# el racionamiento eléctrico del bloque A deja cortes de 5 horas diarios, y
# varios caen justo en el horario en que TI juega (22:00-06:00 hora
# Venezuela). Con las tareas en la PC, una serie que empieza durante el corte
# se pierde para siempre -- la regla 6 la salta por diseño y no se puede
# predecir hacia atrás sin mentir.
#
# El cron de GitHub NO es exacto: puede retrasarse varios minutos en horas de
# pico. Con intervalo de 20 min sigue habiendo margen de sobra frente a
# series que se anuncian con horas de anticipación.

on:
  schedule:
    # Cada 10 min. El cron de GitHub se retrasa varios minutos en horas de
    # pico, así que el intervalo corto compensa: lo que importa no es la
    # precisión sino que pase varias veces entre el momento en que el suizo
    # publica un cruce y el momento en que ese cruce empieza a jugarse.
    # Con el repo público los minutos son ilimitados, así que no cuesta nada.
    - cron: '*/10 * * * *'
  # Para poder dispararlo a mano desde la pestaña Actions.
  workflow_dispatch:
  # También en cada push a main: sirve de CI (las pruebas corren antes de
  # tocar nada) y da una forma de disparar el ciclo sin abrir el navegador.
  # Es seguro porque el ciclo es idempotente: no re-predice una serie ya
  # guardada, no re-avisa lo ya avisado, y no califica dos veces.
  push:
    branches: [main]

# Un solo ciclo a la vez: dos corridas en paralelo podrían predecir la misma
# serie dos veces o mandar el aviso duplicado.
concurrency:
  group: monitor-ti2026
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # El ciclo NO declara `environment`. Lo declaraba, y el 2026-08-17 eso lo
  # tumbó entero: al renombrar el repo, GitHub Pages quedó desconfigurado
  # (GET /repos/.../pages devolvía 404) y el job empezó a fallar en "Set up
  # job" -- el paso previo a todo. Consecuencia: no corrió NI UNA cosa del
  # ciclo (ni cuotas, ni predicciones, ni calificar) durante horas, y el
  # propio aviso de fallo tampoco, porque `if: failure()` necesita que el job
  # arranque para ejecutarse.
  #
  # Ahora publicar el panel vive en su propio job. Que Pages se rompa deja el
  # panel viejo publicado, pero la recolección de datos sigue -- y eso es lo
  # que no se recupera después (regla 6, y las cuotas que se borran).
  ciclo:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - uses: actions/checkout@v4

      # Node 22: el glob de `--test "pruebas/**/*.test.mjs"` necesita 22+ para
      # expandirse igual que en local. Con 20 el patrón no resuelve y las
      # pruebas pasarían sin correr, que es peor que fallar.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Sin dependencias que instalar: motor/ y juez/ son matemática pura y
      # el resto usa sólo builtins de Node.
      # Valida que existan Y que tengan la forma correcta. Comprobar sólo que
      # no estén vacíos no alcanzó: la corrida #2 fallo porque SUPABASE_URL
      # traía el nombre de la variable pegado adelante
      # ("SUPABASE_URL=https://..."), que es lo que sale de copiar la línea
      # entera del .env. El error terminaba siendo un ERR_INVALID_URL enterrado
      # en un stack de undici, imposible de relacionar con el secreto.
      - name: Comprobar los secretos
        run: |
          problemas=0

          revisar_prefijo() {
            if printf '%s' "$2" | grep -q "^$1="; then
              echo "::error::$1 incluye el nombre de la variable en el valor. Poner sólo lo que va DESPUÉS del '=' del .env."
              problemas=1
            fi
          }

          for nombre in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY DISCORD_WEBHOOK; do
            valor=$(printf '%s' "${!nombre}")
            if [ -z "$valor" ]; then
              echo "::error::Falta el secreto $nombre. Ponerlo en Settings > Secrets and variables > Actions."
              problemas=1
              continue
            fi
            revisar_prefijo "$nombre" "$valor"
            if printf '%s' "$valor" | grep -qE '^[[:space:]]|[[:space:]]$'; then
              echo "::error::$nombre tiene espacios al principio o al final."
              problemas=1
            fi
          done

          if ! printf '%s' "$SUPABASE_URL" | grep -qE '^https://[a-z0-9.-]+\.supabase\.co/?$'; then
            echo "::error::SUPABASE_URL no tiene la forma https://<proyecto>.supabase.co"
            problemas=1
          fi

          if ! printf '%s' "$DISCORD_WEBHOOK" | grep -qE '^https://(discord|discordapp)\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+$'; then
            echo "::error::DISCORD_WEBHOOK no tiene la forma https://discord.com/api/webhooks/<id>/<token>"
            problemas=1
          fi

          [ "$problemas" -eq 1 ] && exit 1
          echo "Los tres secretos están puestos y con la forma correcta."

      - name: Pruebas
        run: node --test "pruebas/**/*.test.mjs"

      # 0. Capturar las cuotas de casa de apuestas. Va PRIMERO y con
      #    `if: always()` por una razón concreta: bo3.gg borra la cuota en
      #    cuanto la partida pasa (verificado: 0% de cuota en partidas de
      #    2022-2025), así que es el único dato del ciclo que no se puede
      #    recuperar en la corrida siguiente. Con `always()` sigue corriendo
      #    aunque fallen las pruebas o cualquier paso anterior — no tiene
      #    sentido perder cuotas porque OpenDota (que es de otro juego) se
      #    haya caído.
      - name: Capturar cuotas
        if: always()
        run: node datos/juegos/guardar-cuotas.mjs

      # 0.5 Ciclo de CS2 (Glicko-2 calibrado, Fase 1 cerrada el 2026-08-15).
      #     Independiente del de Dota a propósito: usa bo3.gg, no OpenDota, así
      #     que una caída de uno no arrastra al otro.
      - name: Ciclo CS2 y LoL
        if: always()
        run: node juez/vivo-esports.mjs cs2 lol

      # Avisos de CS2. Va después del ciclo para que anuncie lo que ese mismo
      # paso acaba de predecir o calificar. Sólo tiers s y a: CS2 mueve ~34
      # partidas al día contando todos, y de las 51 predichas hoy sólo 8 eran
      # tier s -- el resto sería ruido.
      - name: Avisar CS2 y LoL por Discord
        if: always()
        run: node salida/discord-esports.mjs cs2 lol

      # 1. Predecir las series que todavía no empezaron. Es el paso que más
      #    urge de los de Dota: si se pierde, la predicción no se recupera.
      - name: Predecir
        if: always()
        run: node juez/vivo-motor.mjs

      # 2. Calificar lo que ya terminó. Si esto falla una vez no se pierde
      #    nada: los resultados siguen en OpenDota para la corrida siguiente.
      - name: Calificar
        if: always()
        run: node juez/vivo-notas.mjs

      # 3. Avisar por Discord lo nuevo. El registro de qué ya se avisó está en
      #    Supabase, así que no repite entre corridas.
      - name: Avisar por Discord
        if: always()
        run: node salida/discord.mjs

      # 4. Regenerar el panel y publicarlo en GitHub Pages.
      - name: Generar el panel
        if: always()
        run: node salida/web/generar.mjs

      # Resumen diario de los tres juegos. Se protege solo: lleva marcado en
      # eslo_estado si ya salió hoy (día de Venezuela), así que correr cada 10
      # minutos no lo repite.
      - name: Resumen diario de los tres juegos
        if: always()
        run: node salida/resumen-global.mjs

      # Aviso de fallo. Sin esto, una corrida rota se descubre por casualidad
      # días después: GitHub manda correo, pero se pierde entre el resto.
      # Va a Discord, que es donde el dueño ya mira.
      #
      # `if: failure()` sólo se dispara si algo anterior falló de verdad, y
      # `continue-on-error` evita que un problema avisando tape el problema
      # real en el resumen de la corrida.
      # Antes esto era un curl con un mensaje de dos líneas. Ahora usa
      # salida/errores.mjs, que arma el aviso con QUÉ paso falló, QUIÉN
      # disparó la corrida, de qué commit salió y a qué hora de Venezuela.
      # Sin eso, cada aviso obligaba a abrir GitHub para entender lo mínimo.
      #
      # Va a DISCORD_WEBHOOK_ERRORES si está puesto; si no, al webhook normal.
      # `continue-on-error` evita que un problema avisando tape el problema
      # real en el resumen de la corrida.
      - name: Subir el panel como artefacto
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: salida/web

  # Publicar el panel, aparte. `continue-on-error` en el job entero: si Pages
  # está mal configurado, el panel se queda como estaba y el ciclo NO se marca
  # como fallido por eso. Un panel desactualizado es un problema menor; perder
  # una tanda de cuotas o de predicciones no se arregla después.
  publicar:
    needs: ciclo
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Publicar en Pages
        id: despliegue
        uses: actions/deploy-pages@v4

  # El aviso de fallo también va en su propio job, y depende de los dos.
  # Estando aparte, se dispara aunque `ciclo` muera en "Set up job" -- que es
  # exactamente lo que pasó el 2026-08-17 y dejó seis fallos seguidos sin un
  # solo aviso a Discord.
  avisar-fallo:
    needs: [ciclo, publicar]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Avisar al canal de errores
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_ERRORES: ${{ secrets.DISCORD_WEBHOOK_ERRORES }}
          MENSAJE_COMMIT: ${{ github.event.head_commit.message }}
        run: |
          # Decir CUÁL job murió, no "el ciclo": con tres jobs, "falló algo" no
          # orienta. `ciclo` es el que recoge datos y el que de verdad importa;
          # `publicar` sólo deja el panel viejo.
          node salida/errores.mjs \
            "ciclo=${{ needs.ciclo.result }} · publicar=${{ needs.publicar.result }}" \
            "Revisar los pasos en rojo del enlace de abajo."
